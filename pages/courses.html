
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Course: Artificial Intelligence</title>

  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --text: #1b1f2a;
      --muted: #5d6475;
      --line: #dfe2e8;
      --accent: #2447d6;
      --accent-text: #ffffff;
      --active-bg: #e8edff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --surface: #1b1e27;
        --text: #eceef4;
        --muted: #9aa1b3;
        --line: #2c303c;
        --accent: #7b96ff;
        --accent-text: #101428;
        --active-bg: #263055;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI",
        Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .layout {
        grid-template-columns: minmax(0, 1fr) 320px;
        align-items: start;
      }
    }

    .player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    .player-wrap iframe,
    .player-wrap #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .counter {
      flex: 1;
      text-align: center;
      color: var(--muted);
      font-size: .95rem;
    }

    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 16px;
      min-height: 44px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: var(--accent);
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    button:focus-visible,
    .item:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .options {
      margin-top: 10px;
      color: var(--muted);
      font-size: .9rem;
    }

    .options label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .notice {
      margin-top: 10px;
      color: #b3261e;
      font-size: .9rem;
      overflow-wrap: anywhere;
    }

    .notice a {
      color: var(--accent);
    }

    .list-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .list-panel h2 {
      margin: 0;
      padding: 12px 14px;
      font-size: .95rem;
      border-bottom: 1px solid var(--line);
    }

    .list {
      max-height: 60vh;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    @media (min-width: 900px) {
      .list {
        max-height: calc(100vh - 160px);
      }
    }

    .item {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item:hover,
    .item.active {
      background: var(--active-bg);
    }

    .item.active {
      font-weight: 650;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .item .n {
      min-width: 2.8em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .item img {
      width: 64px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
      background: var(--line);
      flex-shrink: 0;
    }

    .item .video-title {
      overflow-wrap: anywhere;
    }
  </style>
</head>

  // ==========================================
  // INITIAL SETUP
  // ==========================================

  document.title = COURSE_TITLE;
  document.getElementById("courseTitle").textContent =
    COURSE_TITLE;

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const counter = document.getElementById("counter");
  const listEl = document.getElementById("list");
  const notice = document.getElementById("notice");
  const autoNext = document.getElementById("autoNext");

  function extractId(url) {
    try {
      const parsed = new URL(url);

      let id = null;

      if (parsed.hostname === "youtu.be") {
        id = parsed.pathname.split("/")[1];
      } else if (
        parsed.hostname === "youtube.com" ||
        parsed.hostname.endsWith(".youtube.com")
      ) {
        if (parsed.pathname === "/watch") {
          id = parsed.searchParams.get("v");
        } else {
          const match = parsed.pathname.match(
            /^\/(?:embed|shorts|live)\/([A-Za-z0-9_-]{11})/
          );

          if (match) id = match[1];
        }
      }

      return id && /^[A-Za-z0-9_-]{11}$/.test(id)
        ? id
        : null;
    } catch {
      return null;
    }
  }

  const videos = VIDEO_LINKS
    .split(/\r?\n/)
    .map(url => url.trim())
    .filter(Boolean)
    .map(extractId)
    .filter(Boolean);

  // Keep progress separate for each course.
  const STORAGE_KEY = "course-progress:" + COURSE_TITLE;

  let current = 0;
  let player = null;
  let playerReady = false;
  let pendingIndex = null;

  try {
    const saved = Number(
      localStorage.getItem(STORAGE_KEY)
    );

    if (
      localStorage.getItem(STORAGE_KEY) !== null &&
      Number.isInteger(saved) &&
      saved >= 0 &&
      saved < videos.length
    ) {
      current = saved;
    }
  } catch (error) {
    // The player can still work if storage is unavailable.
  }

  // ==========================================
  // BUILD VIDEO LIST
  // ==========================================

  videos.forEach((id, index) => {
    const li = document.createElement("li");
    li.className = "item";
    li.tabIndex = 0;
    li.dataset.index = index;

    const number = document.createElement("span");
    number.className = "n";
    number.textContent =
      "Lec-" + String(index + 1).padStart(2, "0");

    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.src =
      "https://i.ytimg.com/vi/" + id + "/mqdefault.jpg";

    const title = document.createElement("span");
    title.className = "video-title";
    title.textContent = "Lecture " +
      String(index + 1).padStart(2, "0");

    li.append(number, img, title);

    li.addEventListener("click", () => go(index));

    li.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        go(index);
      }
    });

    listEl.appendChild(li);
  });

  // ==========================================
  // UPDATE USER INTERFACE
  // ==========================================

  function updateUI() {
    counter.textContent = videos.length
      ? "Video " + (current + 1) + " of " + videos.length
      : "No videos available";

    prevBtn.disabled = current <= 0;
    nextBtn.disabled =
      current >= videos.length - 1 || videos.length === 0;

    listEl.querySelectorAll(".item").forEach(item => {
      const active = Number(item.dataset.index) === current;

      item.classList.toggle("active", active);

      if (active) {
        item.setAttribute("aria-current", "true");
      } else {
        item.removeAttribute("aria-current");
      }
    });

    const activeEl = listEl.querySelector(".item.active");

    if (activeEl) {
      activeEl.scrollIntoView({ block: "nearest" });
    }

    try {
      localStorage.setItem(STORAGE_KEY, String(current));
    } catch (error) {
      // Progress saving is optional.
    }
  }

  // ==========================================
  // CHANGE VIDEO
  // ==========================================

  function go(index, autoplay = true) {
    if (index < 0 || index >= videos.length) return;

    current = index;
    notice.replaceChildren();
    updateUI();

    if (!playerReady || !player) {
      pendingIndex = index;
      return;
    }

    if (autoplay) {
      player.loadVideoById(videos[current]);
    } else {
      player.cueVideoById(videos[current]);
    }
  }

  prevBtn.addEventListener("click", () => {
    go(current - 1);
  });

  nextBtn.addEventListener("click", () => {
    go(current + 1);
  });

  document.addEventListener("keydown", event => {
    if (
      event.target.closest("input, button, .item, a, textarea")
    ) {
      return;
    }

    if (event.key === "ArrowRight") {
      go(current + 1);
    }

    if (event.key === "ArrowLeft") {
      go(current - 1);
    }
  });

  // ==========================================
  // YOUTUBE IFRAME API
  // ==========================================

  function onYouTubeIframeAPIReady() {
    if (!videos.length) return;

    player = new YT.Player("player", {
      host: "https://www.youtube.com",
      videoId: videos[current],

      playerVars: {
        enablejsapi: 1,
        origin: window.location.origin,
        rel: 0,
        playsinline: 1
      },

      events: {
        onReady: function () {
          playerReady = true;

          if (pendingIndex !== null) {
            const index = pendingIndex;
            pendingIndex = null;

            go(index, false);
          }
        },

        onStateChange: function (event) {
          if (
            event.data === YT.PlayerState.ENDED &&
            autoNext.checked
          ) {
            if (current < videos.length - 1) {
              go(current + 1);
            }
          }
        },

        onError: function (event) {
          const videoId = videos[current];
          const url =
            "https://www.youtube.com/watch?v=" + videoId;

          const messages = {
            2: "Invalid video ID or player parameter.",
            5: "The HTML5 player could not play this video.",
            100: "This video is unavailable or has been removed.",
            101: "The owner does not allow embedded playback.",
            150: "The owner does not allow embedded playback.",
            153: "YouTube could not verify the request's client or referrer information."
          };

          notice.replaceChildren();

          const message = document.createElement("span");
          message.textContent =
            (messages[event.data] ||
              "YouTube playback failed.") +
            " Error code: " + event.data + ". ";

          const link = document.createElement("a");
          link.href = url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Watch on YouTube";

          notice.append(message, link);
        }
      }
    });
  }

  // ==========================================
  // LOAD API
  // ==========================================

  if (videos.length) {
    updateUI();

    window.onYouTubeIframeAPIReady =
      onYouTubeIframeAPIReady;

    const script = document.createElement("script");
    script.src = "https://www.youtube.com/iframe_api";
    script.async = true;

    script.onerror = function () {
      notice.textContent =
        "Could not load YouTube's player API. " +
        "Check your internet connection or browser extensions.";
    };

    document.head.appendChild(script);
  } else {
    notice.textContent =
      "No valid YouTube links found. Check VIDEO_LINKS.";

    prevBtn.disabled = true;
    nextBtn.disabled = true;
  }
</script>

</body>
