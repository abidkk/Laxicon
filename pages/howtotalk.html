  <script>
    function bullets(items) {
      return `<ul class="list-disc list-inside space-y-1.5 text-ink-soft text-sm">${items.map(i => `<li>${i}</li>`).join("")}</ul>`;
    }

    function trickHTML(t, i) {
      return `
      <div class="word-card p-5" id="trick-${i}">
        <button class="w-full flex items-start justify-between gap-4 text-left" onclick="toggleTrick(${i})">
          <div>
            <span class="font-display text-lg text-ink block mb-1 font-bold ">${t.trick}</span>
            <span class="text-sm text-ink-soft">${t.concept}</span>
          </div>
          <svg class="chevron w-4 h-4 text-ink-soft shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>

        <div class="entry-body">
          <hr class="squiggle-divider my-4" />

          <div class="mb-4">
            <p class="text-xs text-ink-soft mb-1.5 uppercase tracking-wide font-bold bg-[#F6F5F0] p-1">How it works</p>
            ${bullets(t.howItWorks)}
          </div>

          <div class="mb-4">
            <p class="text-xs text-ink-soft mb-1.5 uppercase tracking-wide font-bold bg-[#fffaec] p-1">How to apply</p>
            ${bullets(t.howToApply)}
          </div>

          <div class="mb-4">
            <p class="text-xs text-ink-soft mb-1.5 uppercase tracking-wide font-bold bg-[#F6F5F0] p-1">Common mistakes</p>
            ${bullets(t.commonMistakes)}
          </div>

          <div>
            <p class="text-xs text-ink-soft mb-1.5 uppercase tracking-wide font-bold bg-[#F6F5F0] p-1">Practice tip</p>
            <p class="text-sm text-ink italic ">${t.practiceTip}</p>
          </div>
        </div>
      </div>`;
    }

    function toggleTrick(i) {
      document.getElementById(`trick-${i}`).classList.toggle("open");
    }

    document.getElementById("tricks-list").innerHTML =
      HTTA_TRICKS.map(trickHTML).join("");
  </script>
